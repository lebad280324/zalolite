name: Zalolite native macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CTDOZLITE_SWIFT_BUILD_SYSTEM: native

jobs:
  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run Rust tests
        run: cargo test --locked
      - name: Run Swift tests
        run: swift test --build-system native --package-path native/macos/CTDoNative --scratch-path target/swift-native --configuration release --disable-sandbox
      - name: Build and validate native application
        run: bash packaging/package-native-macos.sh
      - name: Verify synthetic worker and exclusive data ownership
        run: |
          CTDOZLITE_TEST_CORE="$PWD/dist/Zalolite.app/Contents/Helpers/ctdozlite-core" python3 tests/native_core_stdio.py
          python3 tests/native_worker_ownership.py dist/Zalolite.app/Contents/Helpers/ctdozlite-core
      - name: Archive application
        run: ditto -c -k --sequesterRsrc --keepParent dist/Zalolite.app dist/Zalolite-macos-universal.zip
      - uses: actions/upload-artifact@v6
        with:
          name: Zalolite-macos-universal
          path: dist/Zalolite-macos-universal.zip
          if-no-files-found: error
